name: NixOS configuration

on:
  pull_request:
  push:
    branches:
      - sprizan/host-setup

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
      - name: Check flake
        run: nix flake check --impure --print-build-logs
      - name: Evaluate host
        run: nix eval .#nixosConfigurations.sprizan.config.system.build.toplevel.drvPath
      - name: Build host without activation
        run: nix build .#nixosConfigurations.sprizan.config.system.build.toplevel --no-link --print-build-logs
