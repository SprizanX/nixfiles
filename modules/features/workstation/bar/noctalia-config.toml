[shell]
font_family = "Noto Sans"
time_format = "{:%H:%M:%S}"
date_format = "%A, %B %e, %Y"
telemetry_enabled = false
niri_overview_type_to_launch_enabled = true
polkit_agent = true
password_style = "random"
settings_show_advanced = true
clipboard_image_action_command = "satty -f {path}"

[shell.screenshot]
directory = "~/Pictures/Screenshots"

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[wallpaper]
enabled = true
transition_on_startup = true
directory = "~/Pictures/Wallpaper"

[wallpaper.automation]
enabled = true
interval_seconds = 3600

[theme]
mode = "dark"
source = "custom"
custom_palette = "stylix"

[backdrop]
enabled = true

[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0
orientation = "vertical"
position_vertical = "top_right"

[location]
auto_locate = true

[calendar]
enabled = true

[control_center]
[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "power_profile"

[bar.main]
position = "top"
thickness = 34
background_opacity = 1.0
radius = 12
margin_ends = 0
margin_edge = 0
padding = 8
widget_spacing = 6
auto_hide = false
reserve_space = true
start = ["launcher", "wallpaper", "active_window", "media", "weather"]
center = ["workspaces"]
end = ["privacy", "cpu", "sysmon_cpu_temp", "sysmon_gpu", "ram", "tray", "notifications", "network", "volume", "brightness", "clock", "session"]

[dock]
enabled = true
position = "bottom"
icon_size = 42
magnification = true
magnification_scale = 1.45
active_scale = 1.0
show_running = true
show_dots = true
auto_hide = false
reserve_space = true
radius = 18
launcher_position = "start"

[widget.active_window]
capsule = true
max_length = 300
title_scroll = "on_hover"

[widget.clock]
capsule = true
capsule_padding = 9
format = "{:%a, %H:%M}"
tooltip_format = "{:%A, %B %d - %H:%M:%S}"
vertical_format = "{:%H %M}"

[widget.cpu]
show_value = false

[widget.launcher]
glyph = "rocket"

[widget.media]
anchor = true
capsule = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
capsule = true
show_label = false

[widget.notifications]
capsule = true

[widget.privacy]
capsule = true
hide_inactive = true

[widget.ram]
show_value = true

[widget.session]
capsule = true
capsule_foreground = "error"

[widget.sysmon_cpu_temp]
show_value = false
stat = "cpu_temp"
type = "sysmon"

[widget.sysmon_gpu]
show_value = false
stat = "gpu_usage"
type = "sysmon"

[widget.tray]
capsule = true
drawer = true
drawer_columns = 5

[widget.volume]
capsule = true

[widget.weather]
capsule = true

[widget.workspaces]
capsule = true
hide_when_empty = true

    [widget.workspaces.actions]
    scroll_left = "exec niri msg action focus-column-left"
    scroll_right = "exec niri msg action focus-column-right"
